<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⭐ Star Clicker — Galaxy Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --sky-top: #4fc3f7;
  --sky-bot: #b3e5fc;
  --ground-col: #5DBB63;
  --ground2-col: #7DD87F;
  --accent: #FFD700;
  --accent2: #FF6B35;
  --panel-bg: rgba(255,255,255,0.92);
  --text-dark: #333;
  --shadow: 0 4px 14px rgba(0,0,0,0.13);
}

/* ─── THEMES ─── */
body.theme-dawn    { --sky-top:#ff9a9e; --sky-bot:#fecfef; --ground-col:#c0392b; --ground2-col:#e74c3c; }
body.theme-dusk    { --sky-top:#f8b500; --sky-bot:#ff7043; --ground-col:#795548; --ground2-col:#a1887f; }
body.theme-night   { --sky-top:#0d1b2a; --sky-bot:#1b263b; --ground-col:#263238; --ground2-col:#37474f; }
body.theme-cosmic  { --sky-top:#1a0533; --sky-bot:#3a0a5e; --ground-col:#4a0e8f; --ground2-col:#6a1fc2; }
body.theme-aurora  { --sky-top:#004d40; --sky-bot:#00695c; --ground-col:#2e7d32; --ground2-col:#388e3c; }
body.theme-inferno { --sky-top:#b71c1c; --sky-bot:#e64a19; --ground-col:#6d1a04; --ground2-col:#bf360c; }

body {
  font-family: 'Fredoka One', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
  transition: --sky-top 2s, --sky-bot 2s;
}

/* ─── SKY BACKGROUND ─── */
#sky-bg {
  position: fixed;
  inset: 0;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 100%);
  transition: background 3s ease;
  z-index: 0;
}

/* ─── PARALLAX SCENE LAYERS ─── */
#scene-layer {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

/* Stars / Cosmic particles */
.star-particle {
  position: absolute;
  border-radius: 50%;
  background: white;
  animation: twinkle var(--d,2s) infinite alternate;
}
@keyframes twinkle { from{opacity:.1;transform:scale(.7)} to{opacity:1;transform:scale(1.2)} }

/* Clouds */
.cloud {
  position: absolute;
  background: white;
  border-radius: 60px;
  opacity: .82;
  animation: cloudDrift var(--spd,35s) linear infinite;
}
.cloud::before, .cloud::after {
  content:'';position:absolute;background:white;border-radius:50%;
}

/* Ground */
#ground-base {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 88px;
  background: var(--ground-col);
  border-radius: 60px 60px 0 0;
  z-index: 2;
  transition: background 2.5s;
  pointer-events: none;
}
#ground-base::before {
  content:'';position:absolute;top:-22px;left:0;right:0;height:32px;
  background:var(--ground2-col);border-radius:50%;transition:background 2.5s;
}

/* Buildings silhouette layer */
#buildings-layer {
  position: fixed;
  bottom: 70px;
  left: 0; right: 0;
  height: 180px;
  z-index: 2;
  pointer-events: none;
  display: flex;
  align-items: flex-end;
  gap: 0;
  padding: 0 40px;
  justify-content: space-around;
}

/* World decorations */
.world-deco {
  position: fixed;
  pointer-events: none;
  z-index: 2;
  font-size: 28px;
  animation: float var(--ft,4s) ease-in-out infinite alternate;
  transition: opacity 1s;
}
@keyframes float { from{transform:translateY(0)} to{transform:translateY(-10px)} }
@keyframes cloudDrift { from{transform:translateX(-300px)} to{transform:translateX(110vw)} }

/* Shooting star */
.shooting-star-el {
  position:fixed;
  font-size:36px;
  cursor:pointer;
  z-index:9998;
  pointer-events:all;
  animation:shoot 3.8s linear forwards;
  filter:drop-shadow(0 0 14px gold);
  user-select:none;
}
@keyframes shoot {
  0%  {opacity:0;transform:translate(0,0) rotate(-20deg);}
  7%  {opacity:1;}
  90% {opacity:1;}
  100%{opacity:0;transform:translate(65vw,28vh) rotate(-20deg);}
}

/* Meteor shower */
.meteor {
  position:fixed;
  width:3px;
  height:60px;
  background:linear-gradient(180deg,transparent,#FFD700);
  pointer-events:none;
  z-index:3;
  animation:meteorFall var(--dur,1.2s) linear forwards;
  opacity:.8;
}
@keyframes meteorFall {
  from{transform:translateY(-80px) translateX(0) rotate(30deg);opacity:1;}
  to{transform:translateY(100vh) translateX(60px) rotate(30deg);opacity:0;}
}

/* ─── LAYOUT ─── */
.main-layout {
  position: relative;
  z-index: 10;
  display: flex;
  min-height: 100vh;
  align-items: flex-start;
}

.left-panel, .right-panel {
  width: 240px;
  min-width: 240px;
  padding: 10px 8px 120px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-height: 100vh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.3) transparent;
}
.left-panel::-webkit-scrollbar,.right-panel::-webkit-scrollbar{width:3px;}
.left-panel::-webkit-scrollbar-thumb,.right-panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:2px;}

.center-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0 130px;
  gap: 8px;
}

/* ─── SCORE BOX ─── */
.score-box {
  background: var(--panel-bg);
  border-radius: 22px;
  padding: 10px 24px;
  text-align: center;
  border: 3px solid var(--accent);
  box-shadow: 0 5px 0 #e6b800, var(--shadow);
  min-width: 220px;
  backdrop-filter: blur(6px);
}
.score-label { font-size: 10px; color: #aaa; letter-spacing: 1px; font-family:'Nunito',sans-serif; text-transform:uppercase; }
.score-val { font-size: 38px; color: var(--accent2); line-height: 1.05; }
.score-sub { font-size: 12px; color: #999; font-family:'Nunito',sans-serif; }
.score-total { font-size: 11px; color: #bbb; font-family:'Nunito',sans-serif; }
.score-mult { font-size: 12px; color: #a855f7; font-family:'Nunito',sans-serif; font-weight: 800; }

/* ─── LEVEL BADGE ─── */
.level-badge {
  background: linear-gradient(135deg,#FFD700,#FF6B35);
  color: white;
  border-radius: 20px;
  padding: 5px 18px;
  font-size: 13px;
  box-shadow: 0 3px 0 #c05000;
  text-shadow: 1px 1px 0 rgba(0,0,0,.2);
  text-align: center;
}

/* ─── MAIN STAR BTN ─── */
.click-btn {
  width: 210px; height: 210px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: transparent;
  position: relative;
  transition: transform .07s, filter .1s;
  user-select: none;
  filter: drop-shadow(0 10px 22px rgba(255,210,0,.5));
}
.click-btn:active { transform: scale(.83) rotate(-5deg); }
.click-btn:hover  { filter: drop-shadow(0 14px 32px rgba(255,210,0,.75)); }
.click-btn.crit   { animation: critFlash .25s ease; }
@keyframes critFlash { 0%{filter:drop-shadow(0 0 50px #ff0) brightness(2)} 100%{} }

.click-hint {
  font-size: 13px;
  color: rgba(255,255,255,.95);
  background: rgba(0,0,0,.22);
  border-radius: 18px;
  padding: 4px 16px;
}
.crit-chance-label {
  font-size: 11px;
  color: rgba(255,255,255,.8);
  font-family: 'Nunito',sans-serif;
}

/* ─── COMBO ─── */
.combo-display {
  font-size: 14px;
  color: #fff;
  background: linear-gradient(90deg,#ff6b00,#ff003c);
  border-radius: 18px;
  padding: 3px 16px;
  display: none;
  box-shadow: 0 3px 10px rgba(255,50,0,.4);
}

/* ─── PANEL TITLE ─── */
.panel-title {
  font-size: 13px;
  color: rgba(255,255,255,.97);
  text-align: center;
  text-shadow: 1px 2px 0 rgba(0,0,0,.2);
  padding: 4px 0;
  border-bottom: 2px dashed rgba(255,255,255,.4);
  margin-bottom: 3px;
}

/* ─── TAB BAR ─── */
.tab-bar { display:flex; gap:3px; width:100%; }
.tab-btn {
  flex:1;
  background:rgba(255,255,255,.45);
  border:none;
  border-radius:10px;
  padding:5px 2px;
  font-family:'Fredoka One',sans-serif;
  font-size:10px;
  color:white;
  cursor:pointer;
  transition:background .15s;
}
.tab-btn.active { background:rgba(255,255,255,.93); color:#FF6B35; }
.tab-content { display:none; flex-direction:column; gap:5px; }
.tab-content.active { display:flex; }

/* ─── BUY MODE ─── */
.buy-bar { display:flex; gap:3px; margin-bottom:4px; }
.buy-btn {
  flex:1;
  background:rgba(255,255,255,.45);
  border:none;
  border-radius:9px;
  padding:4px 2px;
  font-family:'Fredoka One',sans-serif;
  font-size:10px;
  color:white;
  cursor:pointer;
  transition:background .15s;
}
.buy-btn.active { background:rgba(255,215,0,.9); color:#7b4f00; }

/* ─── CARDS ─── */
.upgrade-card {
  background: var(--panel-bg);
  border-radius: 13px;
  padding: 7px 9px;
  border: 2.5px solid #DDD;
  cursor: pointer;
  transition: transform .1s, border-color .15s, box-shadow .15s;
  position: relative;
}
.upgrade-card:hover:not(.locked) { transform:scale(1.03); border-color:#FFD700; box-shadow:0 4px 12px rgba(255,215,0,.3); }
.upgrade-card.locked { opacity:.4; cursor:not-allowed; }
.upgrade-card.owned  { border-color:#5DBB63; background:rgba(235,255,235,.96); }
.upgrade-card.can-afford { border-color:#FFD700; background:rgba(255,252,220,.97); }
.upg-top { display:flex; align-items:center; gap:6px; }
.upg-icon { font-size:22px; line-height:1; }
.upg-name { font-size:11px; color:#333; flex:1; }
.upg-cost { font-size:10px; font-weight:bold; color:#FF6B35; white-space:nowrap; }
.upg-desc { font-size:9.5px; color:#999; margin-top:2px; font-family:'Nunito',sans-serif; }
.upg-owned-badge {
  font-size:9px;color:#5DBB63;font-family:'Nunito',sans-serif;margin-top:2px;
}

/* ─── ACHIEVEMENT CARDS ─── */
.ach-card {
  background:rgba(255,255,255,.88);
  border-radius:11px;
  padding:6px 8px;
  border:2px solid #DDD;
  display:flex;
  align-items:center;
  gap:6px;
}
.ach-card.unlocked { border-color:#FFD700; background:rgba(255,252,210,.97); }
.ach-card.locked   { opacity:.38; }
.ach-icon { font-size:20px; }
.ach-info { flex:1; }
.ach-name { font-size:10.5px; color:#333; }
.ach-desc { font-size:9px; color:#999; font-family:'Nunito',sans-serif; }

/* ─── QUEST CARDS ─── */
.quest-card {
  background:rgba(255,255,255,.91);
  border-radius:13px;
  padding:9px 11px;
  border:2.5px solid #DDD;
}
.quest-card.done { border-color:#5DBB63; background:rgba(235,255,235,.96); }
.quest-card.claimable { border-color:#FFD700; background:rgba(255,252,210,.97); animation:questPulse 1s infinite alternate; }
@keyframes questPulse { from{box-shadow:0 0 0 rgba(255,215,0,0)} to{box-shadow:0 0 14px rgba(255,215,0,.6)} }
.quest-name { font-size:12px; color:#333; }
.quest-desc { font-size:9.5px; color:#888; font-family:'Nunito',sans-serif; margin-top:2px; }
.quest-bar  { height:7px; background:#EEE; border-radius:4px; margin-top:6px; overflow:hidden; }
.quest-fill { height:100%; background:linear-gradient(90deg,#FFD700,#FF6B35); border-radius:4px; transition:width .4s; }
.quest-prog-text { font-size:9px; color:#aaa; font-family:'Nunito',sans-serif; margin-top:2px; }
.quest-claim {
  margin-top:6px;
  background:linear-gradient(135deg,#5DBB63,#2e7d32);
  border:none; border-radius:10px; color:white;
  padding:5px 14px;
  font-family:'Fredoka One',sans-serif; font-size:12px;
  cursor:pointer; box-shadow:0 3px 0 #1b5e20;
  transition:transform .1s;
  display:block;
  width:100%;
}
.quest-claim:hover { transform:scale(1.04); }
.quest-claim:active { transform:scale(.97); box-shadow:0 1px 0 #1b5e20; }

/* ─── STATS PANEL ─── */
.stat-block {
  background:rgba(255,255,255,.88);
  border-radius:12px;
  padding:8px 10px;
  font-family:'Nunito',sans-serif;
}
.stat-row { display:flex; justify-content:space-between; font-size:11px; color:#555; padding:2px 0; border-bottom:1px solid #eee; }
.stat-row:last-child { border-bottom:none; }
.stat-val { font-weight:800; color:#FF6B35; }

/* ─── PRESTIGE SHOP ─── */
.prestige-shop-card {
  background:rgba(255,255,255,.91);
  border-radius:13px;
  padding:8px 10px;
  border:2.5px solid #DDD;
  cursor:pointer;
  transition:transform .1s, border-color .15s;
}
.prestige-shop-card:hover { transform:scale(1.03); border-color:#a855f7; }
.prestige-shop-card.owned-ps { border-color:#5DBB63; opacity:.6; cursor:not-allowed; }
.ps-top { display:flex; align-items:center; gap:6px; }
.ps-icon { font-size:22px; }
.ps-name { font-size:11px; color:#333; flex:1; }
.ps-cost { font-size:10px; font-weight:bold; color:#a855f7; }
.ps-desc { font-size:9.5px; color:#999; margin-top:2px; font-family:'Nunito',sans-serif; }

/* ─── LOTTERY PANEL ─── */
.lottery-box {
  background:rgba(255,255,255,.91);
  border-radius:16px;
  padding:10px 12px;
  border:2.5px solid #FFD700;
  text-align:center;
}
.lottery-title { font-size:14px; color:#FF6B35; }
.lottery-desc { font-size:10px; color:#888; font-family:'Nunito',sans-serif; margin:4px 0; }
.lottery-btn {
  background:linear-gradient(135deg,#FFD700,#FF6B35);
  border:none; border-radius:12px; color:white;
  padding:7px 18px; font-family:'Fredoka One',sans-serif; font-size:13px;
  cursor:pointer; box-shadow:0 3px 0 #c05000; width:100%;
  transition:transform .1s;
}
.lottery-btn:hover { transform:scale(1.04); }
.lottery-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }

/* ─── PRESTIGE BUTTON ─── */
.prestige-btn {
  background:linear-gradient(135deg,#a855f7,#7e22ce);
  border:none; border-radius:22px; color:white;
  padding:10px 22px; font-family:'Fredoka One',sans-serif; font-size:14px;
  cursor:pointer; box-shadow:0 4px 0 #5b21b6;
  display:none; transition:transform .1s;
  text-shadow:1px 1px 0 rgba(0,0,0,.2);
}
.prestige-btn:hover { transform:scale(1.06); }
.prestige-btn:active { transform:scale(.96); box-shadow:0 2px 0 #5b21b6; }

/* ─── BANNERS / TOASTS ─── */
.milestone-banner {
  position:fixed; top:18px; left:50%; transform:translateX(-50%);
  background:linear-gradient(135deg,#FFD700,#FF6B35);
  color:white; border-radius:32px; padding:11px 34px; font-size:16px;
  box-shadow:0 5px 0 #c05000,0 8px 22px rgba(0,0,0,.2);
  z-index:9999; pointer-events:none; opacity:0;
  transition:opacity .35s; white-space:nowrap;
  text-shadow:1px 1px 0 rgba(0,0,0,.2);
}
.event-banner {
  position:fixed; bottom:98px; left:50%; transform:translateX(-50%);
  background:linear-gradient(135deg,#ff6bea,#a855f7);
  color:white; border-radius:26px; padding:9px 26px; font-size:14px;
  box-shadow:0 4px 0 #7e22ce; z-index:9990; pointer-events:none; opacity:0;
  transition:opacity .35s; white-space:nowrap;
}

/* ─── FLOAT TEXT ─── */
.float-text {
  position:fixed; font-family:'Fredoka One',sans-serif;
  font-size:22px; color:#FFD700;
  text-shadow:1px 1px 0 #B8860B, -1px -1px 0 #B8860B;
  pointer-events:none; z-index:9999;
  animation:floatUp .9s ease-out forwards;
}
.float-text.bonus { color:#ff6bea; text-shadow:1px 1px 0 #8b0060,-1px -1px 0 #8b0060; font-size:28px; }
.float-text.crit  { color:#ff3030; text-shadow:1px 1px 0 #7b0000,-1px -1px 0 #7b0000; font-size:30px; }
@keyframes floatUp {
  0%  { opacity:1; transform:translateY(0) scale(1); }
  100%{ opacity:0; transform:translateY(-110px) scale(.5); }
}

/* ─── SAVE DOT ─── */
.save-dot { position:fixed; bottom:92px; right:14px; font-size:10px; color:rgba(255,255,255,.6); font-family:'Nunito',sans-serif; z-index:20; }

/* ─── STATS ROW ─── */
.stats-row { display:flex; gap:5px; flex-wrap:wrap; justify-content:center; }
.stat-pill  { background:rgba(255,255,255,.82); border-radius:13px; padding:3px 10px; font-size:10px; color:#555; font-family:'Nunito',sans-serif; }

/* ─── SOUND BTN ─── */
.sound-btn {
  background:rgba(255,255,255,.88); border:2.5px solid #DDD; border-radius:18px;
  padding:5px 13px; font-family:'Fredoka One',sans-serif; font-size:11px;
  cursor:pointer; color:#555; transition:transform .1s, border-color .15s;
  display:flex; align-items:center; gap:4px;
}
.sound-btn:hover { border-color:#FFD700; transform:scale(1.05); }
.sound-btn.fart-mode { border-color:#8BC34A; background:rgba(220,255,200,.9); color:#4a7c00; }

/* ─── PASSIVE TICKER ─── */
#passive-ticker { font-size:12px; color:rgba(255,255,255,.95); text-align:center; font-family:'Nunito',sans-serif; }

/* ─── RESPONSIVE ─── */
@media (max-width:800px) {
  .left-panel,.right-panel { width:160px; min-width:160px; padding:6px 4px 110px; }
  .score-val { font-size:30px; }
  .click-btn { width:160px; height:160px; }
}
@media (max-width:560px) {
  .left-panel,.right-panel { width:120px; min-width:120px; }
  .click-btn { width:130px; height:130px; }
}
</style>
</head>
<body>

<!-- Sky -->
<div id="sky-bg"></div>

<!-- Scene layers -->
<div id="scene-layer">
  <!-- Clouds injected by JS -->
</div>

<!-- Buildings layer -->
<div id="buildings-layer"></div>

<!-- Ground -->
<div id="ground-base"></div>

<!-- World decorations injected by JS -->

<div class="main-layout">

  <!-- LEFT: Upgrades / Achievements / Stats -->
  <div class="left-panel">
    <div class="panel-title">✨ Upgrades</div>
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchLeftTab('upg',this)">⬆️</button>
      <button class="tab-btn" onclick="switchLeftTab('ach',this)">🏆</button>
      <button class="tab-btn" onclick="switchLeftTab('stats',this)">📊</button>
      <button class="tab-btn" onclick="switchLeftTab('pshop',this)">✨</button>
    </div>
    <div id="tab-upg"   class="tab-content active"><div id="upgrades-list"></div></div>
    <div id="tab-ach"   class="tab-content"><div id="achievements-list"></div></div>
    <div id="tab-stats" class="tab-content"><div id="stats-list"></div></div>
    <div id="tab-pshop" class="tab-content"><div id="pshop-list"></div></div>
  </div>

  <!-- CENTER -->
  <div class="center-panel">
    <div class="score-box">
      <div class="score-label">Stars Collected</div>
      <div class="score-val" id="score-display">0</div>
      <div class="score-sub" id="cps-display">0/sec</div>
      <div class="score-total" id="total-display">Total: 0</div>
      <div class="score-mult" id="mult-display"></div>
    </div>

    <div class="level-badge" id="level-badge">⭐ Stargazer</div>
    <div id="passive-ticker">Click the star to collect!</div>
    <div class="combo-display" id="combo-display">🔥 ×2 COMBO!</div>

    <button class="click-btn" id="main-btn" onclick="doClick(event)" title="Click!">
      <svg id="star-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" style="width:210px;height:210px">
        <defs>
          <radialGradient id="sg" cx="50%" cy="42%" r="58%">
            <stop offset="0%"   stop-color="#FFFDE7"/>
            <stop offset="55%"  stop-color="#FFD700"/>
            <stop offset="100%" stop-color="#FFA000"/>
          </radialGradient>
          <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%"  stop-color="#FFD700" stop-opacity=".35"/>
            <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
          </radialGradient>
          <filter id="blurF"><feGaussianBlur stdDeviation="2.5"/></filter>
        </defs>
        <circle cx="100" cy="100" r="94" fill="url(#glow)"/>
        <polygon id="star-poly"
          points="100,14 119,70 178,70 130,104 149,160 100,128 51,160 70,104 22,70 81,70"
          fill="url(#sg)" stroke="#E6A800" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="100,30 114,70 100,60 86,70" fill="rgba(255,255,255,.38)"/>
        <ellipse cx="82" cy="82" rx="9" ry="8" fill="rgba(255,255,255,.55)"/>
        <ellipse cx="82" cy="82" rx="4" ry="3.5" fill="rgba(255,255,255,.95)"/>

let audioCtx=null, fartMode=false;
function getCtx(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function playSparkle(pitch){
  try{
    const ctx=getCtx(),t=ctx.currentTime;
    const freqs=[1047,1175,1319,1568,1760,2093,2349];
    const f=pitch||freqs[Math.floor(Math.random()*freqs.length)];
    const osc=ctx.createOscillator(),g=ctx.createGain();
    osc.connect(g);g.connect(ctx.destination);
    osc.type='sine';
    osc.frequency.setValueAtTime(f,t);
    osc.frequency.exponentialRampToValueAtTime(f*1.7,t+.18);
    g.gain.setValueAtTime(.2,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.28);
    osc.start(t);osc.stop(t+.28);
  }catch(e){}
}
function playCrit(){
  try{
    const ctx=getCtx(),t=ctx.currentTime;
    [523,659,880,1047,1319].forEach((f,i)=>{
      const osc=ctx.createOscillator(),g=ctx.createGain();
      osc.connect(g);g.connect(ctx.destination);
      osc.type='triangle';osc.frequency.value=f;
      g.gain.setValueAtTime(.18,t+i*.07);
      g.gain.exponentialRampToValueAtTime(.001,t+i*.07+.3);
      osc.start(t+i*.07);osc.stop(t+i*.07+.35);
    });
  }catch(e){}
}
function playAchSound(){
  try{
    const ctx=getCtx(),t=ctx.currentTime;
    [523,659,784,1047].forEach((f,i)=>{
      const osc=ctx.createOscillator(),g=ctx.createGain();
      osc.connect(g);g.connect(ctx.destination);
      osc.type='sine';osc.frequency.value=f;
      g.gain.setValueAtTime(.15,t+i*.1);
      g.gain.exponentialRampToValueAtTime(.001,t+i*.1+.25);
      osc.start(t+i*.1);osc.stop(t+i*.1+.3);
    });
  }catch(e){}
}

    const ctx=getCtx();
    const bin=atob(FART_B64),buf=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
    ctx.decodeAudioData(buf.buffer,decoded=>{
      const src=ctx.createBufferSource(),g=ctx.createGain();g.gain.value=.8;
      src.buffer=decoded;src.connect(g);g.connect(ctx.destination);src.start(0);
    });
  }catch(e){}
}
function playClickSound(){ fartMode?playFart():playSparkle(); }
function toggleSound(){
  fartMode=!fartMode;
  if(fartMode) S.usedFartMode=true;
  document.getElementById('sound-icon').textContent=fartMode?'💨':'✨';
  document.getElementById('sound-label').textContent=fartMode?'Fart💨':'Sparkle';
  document.getElementById('sound-btn').classList.toggle('fart-mode',fartMode);
  playClickSound();
}

function fmt(n){
  if(n>=1e15) return (n/1e15).toFixed(2)+'Qa';
  if(n>=1e12) return (n/1e12).toFixed(2)+'T';
  if(n>=1e9)  return (n/1e9).toFixed(2)+'B';
  if(n>=1e6)  return (n/1e6).toFixed(2)+'M';
  if(n>=1e3)  return (n/1e3).toFixed(1)+'K';
  return Math.floor(n).toString();
}
function fmtCPS(n){
  if(n>=1e9) return (n/1e9).toFixed(2)+'B';
  if(n>=1e6) return (n/1e6).toFixed(2)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';
  if(n>=10)  return Math.floor(n).toString();
  return n.toFixed(1);
}
function totalGens(){ return Object.values(S.generators).reduce((a,b)=>a+b,0); }
function realUpgCount(){ return Object.keys(S.upgrades).filter(k=>!k.startsWith('ach_')&&!k.startsWith('ps_')).length; }
function boostGen(id,mult){ S.genBoosts[id]=(S.genBoosts[id]||1)*mult; recalcCPS(); }
function genCost(gen,count){ return Math.ceil(gen.baseCost*Math.pow(1.15,count)); }
function genCPS(gen){ return gen.baseCPS*(S.genBoosts[gen.id]||1)*S.genMult*S.prestigeMult*(S.psClickBonus||1); }
function recalcCPS(){
  S.cps=GENERATORS.reduce((acc,g)=>acc+(S.generators[g.id]||0)*genCPS(g),0);
  if(S.cps>S.bestCPS) S.bestCPS=S.cps;
}

// ─── COMBO ───
let lastClickTime=0,comboCount=0,comboTimeout=null;
function updateCombo(){
  const now=Date.now();
  if(now-lastClickTime<600){ comboCount++; if(comboCount>S.maxCombo)S.maxCombo=comboCount; }
  else comboCount=1;
  lastClickTime=now;
  const el=document.getElementById('combo-display');
  if(comboCount>=3){
    el.style.display='block';
    el.textContent=`🔥 ×${comboCount} COMBO!`;
    el.style.animation='none';void el.offsetWidth;
    el.style.animation='comboPulse .3s ease';
  } else el.style.display='none';
  clearTimeout(comboTimeout);
  comboTimeout=setTimeout(()=>{comboCount=0;el.style.display='none';},1500);
  return comboCount>=3?comboCount:1;
}

// ─── CLICK ───
function doClick(e){
  const combo=updateCombo();
  const isCrit=Math.random()<(S.critChance||.05);
  let base=Math.floor(S.clickPower*(S.psClickBonus||1)*S.prestigeMult);
  let gain=combo>=3?Math.floor(base*(1+combo*.1)):base;
  if(isCrit){
    const cm=S.critMult||3;
    gain=Math.floor(gain*cm);
    S.totalCrits++;
    document.getElementById('main-btn').classList.add('crit');
    setTimeout(()=>document.getElementById('main-btn').classList.remove('crit'),300);

}

// ─── BUY GENERATOR ───
function buyGenerator(id){
  const gen=GENERATORS.find(g=>g.id===id);
  if(!gen) return;
  let qty=buyMode;
  if(buyMode==='max'){
    // calc max we can afford
    let tempStars=Math.floor(S.stars),count=S.generators[id]||0,bought=0;
    while(true){
      const c=genCost(gen,count);
      if(tempStars>=c){tempStars-=c;count++;bought++;}
      else break;
    }
    qty=bought;
  }
  if(qty<=0) return;
  let totalCost=0,count=S.generators[id]||0;
  for(let i=0;i<qty;i++) totalCost+=genCost(gen,count+i);
  if(Math.floor(S.stars)<totalCost) return;
  S.stars=Math.floor(S.stars)-totalCost;
  S.generators[id]=(S.generators[id]||0)+qty;
  recalcCPS();
  updateUI();checkAchievements();updateQuestProgress();updateWorldScene();
}

// ─── PRESTIGE ───
function doPrestige(){
  if(S.totalEarned<1e6) return;
  const newMult=S.prestigeMult*2;
  if(!confirm(`Prestige #${S.prestigeCount+1}?\n\nLose everything. Gain ×2 multiplier forever!\n\nCurrent: ×${S.prestigeMult} → ×${newMult}\n\nAlso earn 1 Prestige Point to spend in the Prestige Shop.`)) return;
  const keptClick=S.psKeepClick?Math.floor(S.clickPower*.1):0;
  S.prestigeCount++;
  S.prestigeMult=Math.pow(2,S.prestigeCount);
  S.prestigePoints=(S.prestigePoints||0)+1;
  S.stars=0;S.totalEarned=0;S.passiveBucket=0;
  S.clickPower=1+keptClick;S.genMult=1;S.cps=0;
  S.upgrades=Object.fromEntries(Object.entries(S.upgrades).filter(([k])=>k.startsWith('ach_')||k.startsWith('ps_')));
  S.generators={};S.genBoosts={};
  shownMilestones.clear();
  if(S.psStartGens){ S.generators['g1']=5;S.generators['g2']=5; }
  if(S.psStartBoost>1){
    const oldMult=S.genMult;
    S.genMult*=S.psStartBoost;
    recalcCPS();
    setTimeout(()=>{S.genMult=oldMult;recalcCPS();updateUI();},60000);
  }
  applyPrestigeTheme();
  showBanner('✨ Prestige '+S.prestigeCount+'! ×'+S.prestigeMult+' power!',4500);
  updateUI();checkAchievements();updateWorldScene();
}
function applyPrestigeTheme(){
  const b=document.body;
  const themes=['','theme-dawn','theme-dusk','theme-night','theme-aurora','theme-cosmic','theme-inferno'];
  b.className=themes[Math.min(S.prestigeCount,themes.length-1)]||'';
}

// ─── QUESTS ───
function initQuests(){
  if(!S.activeQuests||S.activeQuests.length===0){
    const shuffled=[...QUESTS_POOL].sort(()=>Math.random()-.5);
    S.activeQuests=shuffled.slice(0,3).map(q=>({...q,claimed:false}));
  }
}

function getQuestProgress(quest){
  switch(quest.type){
    case 'clicks':   return Math.min(S.totalClicks, quest.target);
    case 'earn':     return Math.min(S.totalEarned, quest.target);
    case 'gencount': return Math.min(totalGens(), quest.target);
    case 'upgcount': return Math.min(realUpgCount(), quest.target);
    case 'shoot':    return Math.min(S.shootingStarsCaught, quest.target);
    case 'cps':      return Math.min(S.cps, quest.target);
    case 'crits':    return Math.min(S.totalCrits||0, quest.target);
    case 'lottery':  return Math.min(S.lotteryWins||0, quest.target);
    default: return 0;
  }
}

function claimQuest(idx){
  const quest=S.activeQuests[idx];
  if(!quest||quest.claimed) return;
  const prog=getQuestProgress(quest);
  if(prog<quest.target) return;
  quest.claimed=true;
  S.stars+=quest.reward;
  S.totalEarned+=quest.reward;
  S.questsDone++;
  spawnFloat(window.innerWidth/2, window.innerHeight/2, '+'+fmt(quest.reward)+' 📜','bonus');
  showBanner('📜 Quest done! +'+fmt(quest.reward)+' ⭐',3000);
  saveState();
  updateUI();checkAchievements();
  setTimeout(()=>{
    const usedIds=S.activeQuests.map(q=>q.id);
    const avail=QUESTS_POOL.filter(q=>!usedIds.includes(q.id));
    if(avail.length>0){
      const pick=avail[Math.floor(Math.random()*avail.length)];
      S.activeQuests[idx]={...pick,claimed:false};
    } else {
      // recycle
      const pick=QUESTS_POOL[Math.floor(Math.random()*QUESTS_POOL.length)];
      S.activeQuests[idx]={...pick,claimed:false};
    }
    patchQuests();
  },600);
  patchQuests();
}
function updateQuestProgress(){ patchQuests(); }

function buildLotteryUI(){
  const c=document.getElementById('lottery-tiers');
  c.innerHTML='';
  LOTTERY_TIERS.forEach((tier,i)=>{
    const cost=tier.cost(Math.max(S.stars,1000));

    div.style='margin-bottom:10px;';
    div.innerHTML=`<div style="font-size:13px;color:#333;font-family:'Fredoka One',sans-serif;">${tier.label}</div>

        Cost: ${fmt(cost)} ⭐ — Win ×${tier.minWin}–×${tier.maxWin}${tier.jackpot?' or JACKPOT!':''}
      </div>
      <button class="lottery-btn" ${canAfford?'':'disabled'} onclick="playLottery(${i})">
        🎰 Try ${tier.label}
      </button>`;
    c.appendChild(div);
  });
}
function playLottery(tierIdx){
  const tier=LOTTERY_TIERS[tierIdx];
  const cost=tier.cost(Math.max(S.stars,1000));
  if(Math.floor(S.stars)<cost){closeLottery();return;}
  S.stars=Math.floor(S.stars)-cost;
  const roll=Math.random();
  let mult,msg;
  if(tier.jackpot&&roll<.01){
    mult=100;msg='🎰 JACKPOT! ×100!!';S.lotteryWins++;
    playSparkle(2093);playCrit();
  } else if(roll<.35){
    mult=tier.minWin+(tier.maxWin-tier.minWin)*Math.random();
    msg='🎉 You won ×'+mult.toFixed(1)+'!';S.lotteryWins++;
  } else {
    mult=0;msg='😢 No luck this time…';
  }
  const prize=mult>0?Math.floor(cost*mult):0;
  if(prize>0){S.stars+=prize;S.totalEarned+=prize;}
  showBanner(msg+(prize>0?' (+'+fmt(prize)+' ⭐)':''),3500);
  if(prize>0) spawnFloat(window.innerWidth/2,window.innerHeight/3,'+'+fmt(prize),'bonus');
  updateUI();checkAchievements();updateQuestProgress();buildLotteryUI();
}

function updateWorldScene(){

  let theme=null;
  GENERATORS.forEach(gen=>{
    if((S.generators[gen.id]||0)>0){
      const cfg=SCENE_CONFIGS[gen.scene];
      if(cfg&&cfg.theme) theme=cfg.theme;
    }

    document.body.className='';
    document.body.classList.add(theme);

  GENERATORS.forEach((gen,gi)=>{

    if(count===0) return;
    const cfg=SCENE_CONFIGS[gen.scene];
    if(!cfg||cfg.building||cfg.sky) return;
    const numToShow=Math.min(count,4);
    for(let i=0;i<numToShow;i++){
      const el=document.createElement('div');
      el.className='world-deco';
      const pos=cfg.positions[i%cfg.positions.length];
      const delay=i*.8;
      el.style.cssText=`left:${pos[0]}%;bottom:${pos[1]}px;--ft:${3+i}s;animation-delay:-${delay}s;font-size:${22+Math.min(count,5)*2}px;`;
      el.textContent=cfg.emoji;
      document.body.appendChild(el);
    }
  });
}

function updateBuildings(){
  const layer=document.getElementById('buildings-layer');
  layer.innerHTML='';
  const hasFact=(S.generators['g7']||0)>0;
  const hasPulsar=(S.generators['g11']||0)>0;
  const hasWorm=(S.generators['g12']||0)>0;
  const hasGod=(S.generators['g13']||0)>0;
  const buildings=[];
  if(hasFact){
    const n=Math.min(S.generators['g7']||0,5);
    for(let i=0;i<n;i++){
      buildings.push({emoji:'🏭',size:40+i*4});
    }
  }
  if(hasPulsar){
    buildings.push({emoji:'📡',size:48});
  }
  if(hasWorm){
    buildings.push({emoji:'🌀',size:56});
  }
  if(hasGod){
    buildings.push({emoji:'👑',size:64});
  }
  buildings.forEach(b=>{
    const el=document.createElement('div');
    el.style.cssText=`font-size:${b.size}px;line-height:1;opacity:.9;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3));`;
    el.textContent=b.emoji;
    layer.appendChild(el);
  });
}

// ─── UI ───
function updateUI(){
  document.getElementById('score-display').textContent=fmt(S.stars);
  document.getElementById('cps-display').textContent=fmtCPS(S.cps)+'/sec';
  document.getElementById('total-display').textContent='Total: '+fmt(S.totalEarned);
  const eff=Math.floor(S.clickPower*(S.psClickBonus||1)*S.prestigeMult);
  document.getElementById('cpc-label').textContent=fmt(eff);
  document.getElementById('passive-ticker').textContent=S.cps>0?'🌀 Auto: '+fmtCPS(S.cps)+'/sec':'👆 Click the star!';
  document.getElementById('total-clicks-pill').textContent=fmt(S.totalClicks)+' clicks';
  document.getElementById('best-cps-pill').textContent='Best: '+fmtCPS(S.bestCPS)+'/s';
  document.getElementById('level-badge').textContent=getLevel()[1];
  document.getElementById('crit-pct').textContent=Math.round((S.critChance||.05)*100);
  document.getElementById('prestige-btn').style.display=S.totalEarned>=1e6?'block':'none';
  document.getElementById('prestige-label').textContent=S.prestigeCount>0?'✨ Prestige ×'+S.prestigeCount+' — ×'+S.prestigeMult+' power':'';
  document.getElementById('prestige-pts-label').textContent=(S.prestigePoints||0)>0?'💠 Prestige Points: '+(S.prestigePoints||0):'';
  if(S.prestigeMult>1) document.getElementById('mult-display').textContent='✨ ×'+S.prestigeMult+' Prestige Multiplier';
  else document.getElementById('mult-display').textContent='';
  patchUpgrades();patchGenerators();patchAchievements();patchQuests();patchStats();patchPrestigeShop();
}

function patchUpgrades(){
  const c=document.getElementById('upgrades-list');
  const stars=Math.floor(S.stars);
  UPGRADES.forEach(upg=>{
    let card=document.getElementById('card-upg-'+upg.id);
    if(!card){
      card=document.createElement('div');card.id='card-upg-'+upg.id;card.className='upgrade-card';
      card.innerHTML=`<div class="upg-top"><span class="upg-icon">${upg.icon}</span><span class="upg-name">${upg.name}</span><span class="upg-cost" id="cost-upg-${upg.id}"></span></div><div class="upg-desc">${upg.desc}</div>`;
      card.addEventListener('click',()=>buyUpgrade(upg.id));
      c.appendChild(card);
    }
    const owned=!!S.upgrades[upg.id];
    card.className='upgrade-card'+(owned?' owned':stars>=upg.cost?' can-afford':' locked');
    document.getElementById('cost-upg-'+upg.id).textContent=owned?'✓':fmt(upg.cost)+'⭐';
  });
}

function patchGenerators(){
  const c=document.getElementById('generators-list');
  const stars=Math.floor(S.stars);
  GENERATORS.forEach(gen=>{
    let card=document.getElementById('card-gen-'+gen.id);
    if(!card){
      card=document.createElement('div');card.id='card-gen-'+gen.id;card.className='upgrade-card';
      card.innerHTML=`<div class="upg-top"><span class="upg-icon">${gen.icon}</span><span class="upg-name">${gen.name}</span><span class="upg-cost" id="cost-gen-${gen.id}"></span></div><div class="upg-desc" id="desc-gen-${gen.id}"></div><div id="owned-gen-${gen.id}" class="upg-owned-badge"></div>`;
      card.addEventListener('click',()=>buyGenerator(gen.id));
      c.appendChild(card);
    }
    const owned=S.generators[gen.id]||0;
    const qty=buyMode==='max'?Math.max(1,calcMaxBuy(gen)):buyMode;
    let totalCost=0,cnt=owned;
    const realQty=typeof qty==='number'?qty:1;
    for(let i=0;i<realQty;i++) totalCost+=genCost(gen,cnt+i);
    const canAfford=stars>=totalCost;
    card.className='upgrade-card'+(canAfford?' can-afford':owned>0?'':' locked');
    if(owned>0) card.style.borderColor='#5DBB63'; else card.style.borderColor='';
    const showQty=buyMode==='max'?calcMaxBuy(gen):buyMode;
    document.getElementById('cost-gen-'+gen.id).textContent=fmt(totalCost)+'⭐'+(showQty>1?' (×'+showQty+')':'');
    document.getElementById('desc-gen-'+gen.id).textContent=fmtCPS(genCPS(gen))+'/sec each';
    document.getElementById('owned-gen-'+gen.id).textContent=owned?'Owned: '+owned+' → '+fmtCPS(genCPS(gen)*owned)+'/s':'';
  });
}

function calcMaxBuy(gen){
  let stars=Math.floor(S.stars),count=S.generators[gen.id]||0,bought=0;
  while(true){const c=genCost(gen,count);if(stars>=c){stars-=c;count++;bought++;}else break;}
  return Math.max(1,bought);
}

function patchAchievements(){
  const c=document.getElementById('achievements-list');
  ACHIEVEMENTS.forEach(ach=>{
    let card=document.getElementById('card-ach-'+ach.id);
    if(!card){
      card=document.createElement('div');card.id='card-ach-'+ach.id;card.className='ach-card';
      card.innerHTML=`<span class="ach-icon">${ach.icon}</span><div class="ach-info"><div class="ach-name">${ach.name}</div><div class="ach-desc">${ach.desc}</div></div>`;
      c.appendChild(card);
    }
    const unlocked=!!S.upgrades['ach_'+ach.id]||ach.check();
    card.className='ach-card'+(unlocked?' unlocked':' locked');
  });
}

// ─── QUEST PATCH (BUG FIXED) ───
function patchQuests(){
  const c=document.getElementById('quests-list');
  if(!c) return;
  c.innerHTML='';
  if(!S.activeQuests||S.activeQuests.length===0) return;
  S.activeQuests.forEach((quest,idx)=>{
    const prog=getQuestProgress(quest);
    const pct=Math.min(100,Math.floor(prog/quest.target*100));
    const done=prog>=quest.target;
    const claimable=done&&!quest.claimed;
    const div=document.createElement('div');
    div.className='quest-card'+(quest.claimed?' done':claimable?' claimable':'');
    div.innerHTML=`
      <div class="quest-name">${quest.name}</div>
      <div class="quest-desc">${quest.desc} — Reward: ${fmt(quest.reward)}⭐</div>
      <div class="quest-bar"><div class="quest-fill" style="width:${pct}%"></div></div>
      <div class="quest-prog-text">${fmt(prog)} / ${fmt(quest.target)}</div>
      ${claimable?`<button class="quest-claim" id="qclaim-${idx}">🎁 Claim Reward!</button>`:''}
      ${quest.claimed?`<div style="font-size:10px;color:#5DBB63;margin-top:4px;font-family:'Nunito',sans-serif;">✓ Claimed</div>`:''}
    `;
    // Attach claim button AFTER inserting into DOM
    c.appendChild(div);
    if(claimable){
      const btn=div.querySelector(`#qclaim-${idx}`);
      if(btn) btn.addEventListener('click',(e)=>{ e.stopPropagation(); claimQuest(idx); });
    }
  });
}

function patchStats(){
  const c=document.getElementById('stats-list');
  if(!c) return;
  c.innerHTML='';
  const rows=[
    ['Total Stars Earned', fmt(S.totalEarned)+' ⭐'],
    ['Current Stars', fmt(S.stars)+' ⭐'],
    ['Stars/sec', fmtCPS(S.cps)],
    ['Best Stars/sec', fmtCPS(S.bestCPS)],
    ['Total Clicks', fmt(S.totalClicks)],
    ['Critical Clicks', fmt(S.totalCrits||0)],
    ['Crit Chance', Math.round((S.critChance||.05)*100)+'%'],
    ['Click Power', fmt(Math.floor(S.clickPower*(S.psClickBonus||1)*S.prestigeMult))],
    ['Generators Owned', totalGens()],
    ['Upgrades Bought', realUpgCount()],
    ['Shooting Stars Caught', S.shootingStarsCaught],
    ['Quests Completed', S.questsDone],
    ['Lottery Wins', S.lotteryWins||0],
    ['Prestige Count', S.prestigeCount],
    ['Prestige Multiplier', '×'+S.prestigeMult],
    ['Prestige Points', S.prestigePoints||0],
    ['Max Combo', S.maxCombo],
  ];
  const block=document.createElement('div');block.className='stat-block';
  rows.forEach(([k,v])=>{
    block.innerHTML+=`<div class="stat-row"><span>${k}</span><span class="stat-val">${v}</span></div>`;
  });
  c.appendChild(block);
}

function patchPrestigeShop(){
  const c=document.getElementById('pshop-list');
  if(!c) return;
  c.innerHTML='';
  const pts=document.createElement('div');
  pts.style='font-size:13px;color:rgba(255,255,255,.9);text-align:center;padding:4px;text-shadow:1px 1px 0 rgba(0,0,0,.3);font-family:"Fredoka One",sans-serif;';
  pts.textContent='💠 Prestige Points: '+(S.prestigePoints||0);
  c.appendChild(pts);
  const note=document.createElement('div');
  note.style='font-size:9px;color:rgba(255,255,255,.7);text-align:center;font-family:"Nunito",sans-serif;margin-bottom:6px;';
  note.textContent='Earn by Prestiging. Survive resets!';
  c.appendChild(note);
  PRESTIGE_SHOP.forEach(item=>{
    const owned=!!S.upgrades['ps_'+item.id];
    const div=document.createElement('div');
    div.className='prestige-shop-card'+(owned?' owned-ps':'');
    div.innerHTML=`<div class="ps-top"><span class="ps-icon">${item.icon}</span><span class="ps-name">${item.name}</span><span class="ps-cost">${owned?'✓':item.cost+'💠'}</span></div><div class="ps-desc">${item.desc}</div>`;
    if(!owned) div.addEventListener('click',()=>buyPrestigeShop(item.id));
    c.appendChild(div);
  });
}

// ─── TAB SWITCHING ───
function switchLeftTab(tab,btn){
  ['upg','ach','stats','pshop'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('active',t===tab));
  document.querySelectorAll('.left-panel .tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='stats') patchStats();
  if(tab==='pshop') patchPrestigeShop();
}
function switchRightTab(tab,btn){
  ['gen','quest'].forEach(t=>document.getElementById('tab-'+t).classList.toggle('active',t===tab));
  document.querySelectorAll('.right-panel .tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

// ─── PASSIVE INCOME LOOP ───
setInterval(()=>{
  if(S.cps>0){
    S.passiveBucket+=S.cps/20;
    const whole=Math.floor(S.passiveBucket);
    if(whole>0){
      S.passiveBucket-=whole;
      S.stars=Math.floor(S.stars)+whole;
      S.totalEarned+=whole;
      checkMilestones();
    }
    updateUI();checkAchievements();
  }
},50);

// ─── INIT ───
applyPrestigeTheme();
initQuests();
recalcCPS();
updateUI();
checkAchievements();
updateWorldScene();

// Restore milestone set silently
for(const[n] of MILESTONES) if(S.totalEarned>=n) shownMilestones.add(n);
for(const ach of ACHIEVEMENTS) if(S.upgrades['ach_'+ach.id]) shownAchievements.add(ach.id);

// Refresh scene every 30s for any dynamic changes
setInterval(updateWorldScene, 30000);
</script>
